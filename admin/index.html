<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Photon Capture</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <span class="section-kicker">ADMINISTRATION</span>
            <div style="margin-bottom: 2rem;">
                <a href="../index.html" class="logo" style="margin-bottom: 0;">PHOTON CAPTURE</a>
            </div>

            <div id="error-msg" class="error-message">
                Zugriff verweigert: Passwort ungültig
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="password">Administrator Passwort</label>
                    <input type="password" id="password" class="form-control" placeholder="Passwort eingeben" required
                        autofocus>
                </div>
                <button type="submit" class="btn" style="margin-top: 0.5rem;">Anmelden</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        // Check if already logged in
        if (sessionStorage.getItem('photon_admin_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            if (password === 'photon2024') {
                sessionStorage.setItem('photon_admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                form.reset();
            }
        });
    </script>
</body>

</html>
