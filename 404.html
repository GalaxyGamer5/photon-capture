<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden | Photon Capture</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-family: var(--font-heading);
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .error-message {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin: 1.5rem 0 2.5rem;
            max-width: 480px;
            line-height: 1.6;
        }

        .shine {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 122, 61, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="shine"></div>
        <div style="position: relative; z-index: 2;">
            <a href="index.html" class="brand-logo" style="margin-bottom: 2rem; display: inline-flex;">PHOTON CAPTURE</a>
            <h1 class="error-code">404</h1>
            <p class="error-message">Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
            <a href="index.html" class="pill-btn pill-btn-accent">Zurück zur Startseite</a>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
